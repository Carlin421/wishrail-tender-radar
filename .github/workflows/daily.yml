name: Tender Radar CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "reports/**"
  workflow_dispatch:
  schedule:
    # 00:10 UTC = 08:10 Taiwan time
    - cron: "10 0 * * 1-5"

permissions:
  contents: write

concurrency:
  group: tender-radar-main
  cancel-in-progress: true

jobs:
  test-and-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Unit tests
        run: PYTHONPATH=. pytest -q

      - name: Scan official PCC data
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python official_radar.py --days 5 --top 15
          else
            python official_radar.py --days 2 --top 15
          fi

      - name: Commit daily report
        if: success()
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "tender-radar-bot@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "No report changes"
            exit 0
          fi
          git commit -m "chore: update tender report [skip ci]"
          git pull --rebase origin main
          git push origin main
