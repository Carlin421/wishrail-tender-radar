name: PCC Detail Diagnostic

on:
  push:
    paths:
      - ".github/workflows/pcc-diagnostic.yml"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Verify production hydrate on known tenders
        run: |
          python - <<'PY'
          from pcc_official import PCC
          pcc=PCC(delay=0.1)
          targets={"115-04-02-04-E","115-77A"}
          found={t.job_number:t for t in pcc.daily("20260924") if t.job_number in targets}
          for job in sorted(targets):
              t=found[job]
              pcc.hydrate(t)
              print("VERIFY", job, "budget=", t.budget, "deadline=", t.deadline,
                    "award=", t.award_type, "qualification=", t.qualification[:120])
          assert found["115-04-02-04-E"].budget == 1450000
          assert found["115-04-02-04-E"].deadline.startswith("2026-09-29 17:00")
          assert "最有利標" in found["115-04-02-04-E"].award_type
          assert found["115-77A"].budget == 3100000
          assert found["115-77A"].deadline.startswith("2026-10-13 17:00")
          print("KNOWN_TENDER_HYDRATE_OK")
          PY
