name: Official PCC parser diagnostic

on:
  push:
    paths:
      - ".github/workflows/official-pcc-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Nantou detail markup
        run: |
          curl -sS -L --fail-with-body --max-time 35 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0" \
            "https://web.pcc.gov.tw/prkms/tender/common/noticeDate/redirectPublic?ds=20260924&fn=TIQ-11-71121459.xml" \
            -o /tmp/detail.html
          echo "BUDGET"
          grep -n -A12 -B2 "預算金額" /tmp/detail.html | head -80 || true
          echo "DEADLINE"
          grep -n -A10 -B2 "截止投標" /tmp/detail.html | head -60 || true
          echo "AWARD"
          grep -n -A10 -B2 "決標方式" /tmp/detail.html | head -60 || true
