name: Official PCC connectivity test

on:
  push:
    paths:
      - ".github/workflows/official-pcc-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect one official tender detail
        run: |
          curl -sS -L --fail-with-body --max-time 30             -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64; rv:132.0) Gecko/20100101 Firefox/132.0"             "https://web.pcc.gov.tw/prkms/tender/common/noticeDate/redirectPublic?ds=20260924&fn=TIQ-1-71121325.xml"             -o /tmp/detail.html
          wc -c /tmp/detail.html
          grep -n -E '預算金額|截止投標|廠商資格|標案名稱|決標方式|押標金|履約保證金|Web Page Blocked|validate/check' /tmp/detail.html | head -120 || true
