name: Full Tender Refresh # final

on:
  push:
    paths:
      - ".github/workflows/full-refresh.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. pytest -q
      - name: Run full five-day scan
        run: python official_radar.py --days 5 --top 15
      - name: Commit refreshed report
        run: |
          git config user.name "tender-radar-bot"
          git config user.email "tender-radar-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "chore: refresh full tender report [skip ci]"
          git pull --rebase origin main
          git push
